# Netlify is the host. The app is still almost entirely static, but it now has
# one function: the signalling relay that lets two browsers find each other
# (netlify/functions/signal.ts), routed below.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify defaults to both of these, but the relay is load-bearing now and a
# silent default is a bad thing to discover during an outage.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The relay, routed explicitly and *before* the catch-all below. Ordering is
# the whole point: redirects are matched in order, so without this rule the SPA
# fallback would answer every signalling request with the page itself and no
# room would ever connect. Stated here rather than left to the function's own
# path declaration, because a routing mistake means nobody can join at all.
[[redirects]]
  from = "/api/signal"
  to = "/.netlify/functions/signal"
  status = 200

# TURN credentials, before the catch-all for the same reason. This one fails
# softer than the signalling route -- the app falls back to STUN and most rooms
# never notice -- but the rooms that do need it are exactly the ones that
# cannot connect at all, so a silent misroute here is invisible until somebody
# on a mobile network cannot join.
[[redirects]]
  from = "/api/turn"
  to = "/.netlify/functions/turn"
  status = 200

# Hash-based routing means every other path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Signalling is live by definition, and the relay says so itself; this is here
# so no CDN in front of it can decide otherwise.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
