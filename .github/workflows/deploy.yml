name: Build, publish to web branch, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # force-push the build to `web`
  pages: write # publish it
  id-token: write # OIDC, required by deploy-pages

# GitHub cancels an in-flight Pages deployment when a newer one arrives, so
# queue them instead of letting two races cancel each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate as CI: a broken build never reaches the live site.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx vite build

      - name: Prepare for GitHub Pages
        run: |
          # Pages serves 404.html for unknown paths. Routing is hash-based, so
          # this only matters for stale deep links.
          cp dist/index.html dist/404.html
          # Stop Pages running the output through Jekyll.
          touch dist/.nojekyll

      # `web` exists so the deployed files are inspectable as ordinary files.
      # It holds only build output, so each deploy replaces it wholesale rather
      # than accumulating a history of generated files nobody will read.
      - name: Publish to web branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            web:web
          # Must not end up inside the Pages artifact.
          cd .. && rm -rf dist/.git

      # Deploying the artifact directly, rather than pointing Pages at the
      # `web` branch. Branch mode makes GitHub run its own auto-generated
      # builder, which is opaque when it fails and races with this workflow
      # over the same commit. One workflow, one deployment, one place to look.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "Published \`web\` and deployed ${GITHUB_SHA::7}." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
