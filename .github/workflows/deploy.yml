name: Build and publish to web branch

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to force-push the build output to the `web` branch.
permissions:
  contents: write

# Never let two deploys race to overwrite `web`.
concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate as CI: a broken build never reaches the live site.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx vite build

      - name: Prepare for GitHub Pages
        run: |
          # Pages serves 404.html for unknown paths. Routing is hash-based, so
          # this only matters for stale deep links.
          cp dist/index.html dist/404.html
          # Stop Pages running the output through Jekyll.
          touch dist/.nojekyll

      # `web` holds only build output, so each deploy replaces it wholesale.
      # Force-pushing an orphan commit keeps the branch from accumulating a
      # history of generated files nobody will ever read.
      - name: Publish to web branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            web:web

      - name: Summary
        run: |
          echo "Published \`web\` from ${GITHUB_SHA::7}." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pages must be set to **Deploy from a branch → web → / (root)**." \
            >> $GITHUB_STEP_SUMMARY
